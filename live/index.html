<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Битва коммерсантов</title>
<meta name="theme-color" content="#1B0B3B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<style>
  html, body { height: 100%; }
  body { overflow-x: hidden; }
  .app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .top b { font-weight: 900; font-size: .95rem; }
  .main { display: flex; flex-direction: column; min-height: 0;
    padding: 6px max(14px, env(safe-area-inset-right, 0px)) 14px max(14px, env(safe-area-inset-left, 0px)); }
  .bottom { display: flex; align-items: center; gap: 10px; background: rgba(0, 0, 0, .35);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bottom .nm { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom .sc { font-weight: 900; font-size: 1.2rem; background: #fff; color: var(--ink); padding: .2em .7em; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .bottom .sc.bump { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }

  .center { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 14px; padding: 10px 6px; }
  .center h1 { font-size: clamp(1.8rem, 8vw, 2.6rem); }
  .center p { margin: 0; color: var(--dim); font-weight: 700; max-width: 30ch; }
  .big { font-size: 4.2rem; line-height: 1; }
  .logo { font-size: clamp(2rem, 10vw, 2.8rem); font-weight: 900; line-height: .95; text-align: center; }
  .logo span { display: block; color: var(--gold); }
  .join { width: min(100%, 400px); padding: 22px; display: grid; gap: 14px; margin-top: 8px; }
  .spin { width: 46px; height: 46px; border-radius: 50%; border: 6px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .qhead { display: grid; gap: 10px; margin-bottom: 12px; }
  .qtext { background: #fff; color: var(--ink); border-radius: 10px; padding: 12px 14px; font-weight: 800; font-size: 1.02rem; line-height: 1.35; box-shadow: var(--lift); }
  .tbar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  .tbar i { display: block; height: 100%; background: #fff; border-radius: 99px; }
  .tline { display: flex; justify-content: space-between; font-weight: 800; font-size: .85rem; color: var(--dim); }
  .tiles { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 280px; }
  .tiles.two { grid-template-columns: 1fr; }
  .tiles .tile { flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 12px 10px; font-size: 1rem; }
  .tiles .tile .sh { width: 2.6em; height: 2.6em; }
  .tiles .tile:active { transform: scale(.96); }
  .tiles.short .tile { font-size: 1.15rem; }

  .result { flex: 1; margin: -6px -14px -14px; display: grid; place-content: center; justify-items: center; text-align: center; gap: 12px; padding: 20px; }
  .result.ok { background: var(--good); }
  .result.no { background: var(--bad); }
  .result.none { background: rgba(0, 0, 0, .25); }
  .result h1 { font-size: 2.4rem; }
  .result .ic { width: 96px; height: 96px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 3.4rem; font-weight: 900; box-shadow: var(--lift); }
  .result.ok .ic { color: var(--good); } .result.no .ic { color: var(--bad); }
  .result .gain { font-size: 2rem; font-weight: 900; background: rgba(0, 0, 0, .22); padding: .15em .7em; border-radius: 10px; }
  .result .note { background: rgba(0, 0, 0, .2); border-radius: 10px; padding: 10px 14px; font-weight: 700; max-width: 34ch; }
  .rank { font-weight: 800; color: rgba(255, 255, 255, .9); }

  .alert { position: fixed; inset: 0; z-index: 800; display: grid; place-items: center; padding: 20px; background: rgba(10, 4, 25, .7); }
  .alert .box { width: min(100%, 380px); padding: 26px 22px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .alert .em { font-size: 4rem; line-height: 1; }
  .alert .d { font-size: 3.2rem; font-weight: 900; }
  .alert.neg .d { color: var(--bad); } .alert.pos .d { color: var(--good); }
  .alert p { margin: 0; color: var(--ink-2); font-weight: 700; }
  .linkbtn { background: none; color: var(--dim); text-decoration: underline; font-weight: 700; font-size: .85rem; padding: 6px; }
</style>
</head>
<body>
<div class="floaters" aria-hidden="true"></div>
<div class="app">
  <div class="top"><b id="topL">Битва коммерсантов</b><span class="pill"><span class="dot" id="netdot"></span><span id="nettxt">подключаемся…</span></span></div>
  <main class="main" id="main"></main>
  <div class="bottom" id="bottom" hidden><div class="avatar" id="meAv"></div><span class="nm" id="meName"></span><span class="sc" id="meScore">0</span></div>
</div>
<div class="alert" id="alert" hidden><div class="box card pop" id="alertBox"></div></div>
<div class="toast-stack" id="toasts"></div>

<script src="vendor/qrcode.js"></script>
<script src="questions.js?v=2"></script>
<script src="common.js?v=2"></script>
<script src="student.js?v=2"></script>
</body>
</html>
