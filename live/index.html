<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Битва коммерсантов</title>
<meta name="theme-color" content="#1F50FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Unbounded:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=6">
<style>
  html, body { height: 100%; }
  body { overflow-x: hidden; }
  .app { position: relative; z-index: 1; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
  .top b { font-family: var(--f-d); font-weight: 800; font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; background: var(--navy); padding: .45em .8em; border-radius: 8px; transform: rotate(-2deg); }
  .room-name { display:inline-flex; align-items:center; border:2px solid var(--white); border-radius:8px; font-size:.72rem; padding:.35em .65em; font-weight:800; white-space:nowrap; }
  .field select { width: 100%; min-height: 48px; padding: .75em; font-size: 1rem; color: var(--navy); background: var(--ice); border: 4px solid var(--navy); border-radius: 12px; font-weight: 800; }
  .main { display: flex; flex-direction: column; min-height: 0; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 16px max(14px, env(safe-area-inset-left, 0px)); }
  .bottom { display: flex; align-items: center; gap: 10px; background: var(--navy);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .bottom .nm { flex: 1; min-width: 0; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bottom .sc { font-family: var(--f-d); font-weight: 900; font-size: 1.05rem; background: var(--white); color: var(--navy); padding: .25em .7em; border-radius: 8px; font-variant-numeric: tabular-nums; transform: rotate(-2deg); }
  .bottom .sc.bump { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); }

  .center { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 16px; padding: 10px 4px; }
  .center h1 { font-size: clamp(1.7rem, 8.5vw, 2.4rem); }
  .center p { margin: 0; font-weight: 700; max-width: 30ch; }
  .card { padding: 20px; display: grid; gap: 12px; justify-items: center; text-align: center; width: min(100%, 380px); }
  .card h1 { font-size: 1.6rem; }
  .card p { color: var(--navy); }
  .big { font-size: 3.6rem; line-height: 1; }
  .hero-logo { font-size: clamp(2.2rem, 12vw, 3.2rem); text-align: center; }
  .join { width: min(100%, 400px); padding: 20px; display: grid; gap: 14px; }

  .qtext { padding: 14px 16px; font-weight: 700; font-size: 1.05rem; line-height: 1.35; margin-bottom: 10px; }
  .tline { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 12px; }
  .tline .ribbon { font-size: .7rem; }
  .timer { font-family: var(--f-d); font-weight: 900; font-size: 1.4rem; background: var(--white); color: var(--navy); border: 3px solid var(--navy); border-radius: 50%; width: 2.6em; height: 2.6em; display: grid; place-items: center; box-shadow: var(--shadow-s); }
  .timer.hurry { background: var(--navy); color: var(--white); border-color: var(--white); animation: pulse .5s infinite; }
  .opts { flex: 1; display: grid; gap: 12px; align-content: stretch; }
  .opts .opt { padding: 14px 14px; font-size: 1.05rem; min-height: 64px; }
  .opts .opt:active { transform: translate(4px, 4px); box-shadow: none; }

  .result { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 16px; }
  .result .stamp { font-family: var(--f-d); font-weight: 900; font-size: clamp(2.4rem, 13vw, 3.6rem); text-transform: uppercase; padding: .1em .45em; border: 6px solid currentColor; border-radius: 16px; transform: rotate(-8deg); }
  .result.ok .stamp { background: var(--white); color: var(--navy); box-shadow: var(--shadow); }
  .result.no .stamp { color: var(--white); border-style: dashed; }
  .result .gain { font-family: var(--f-d); font-weight: 900; font-size: 2.2rem; }
  .result .note { padding: 12px 16px; font-weight: 700; max-width: 32ch; }
  .rank { font-family: var(--f-d); font-weight: 800; text-transform: uppercase; font-size: .9rem; }

  .alert { position: fixed; inset: 0; z-index: 800; display: grid; place-items: center; padding: 20px; background: rgba(7, 26, 92, .8); }
  .alert .box { width: min(100%, 380px); padding: 24px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
  .alert .em { font-size: 4rem; line-height: 1; }
  .alert .d { font-family: var(--f-d); font-size: 3rem; font-weight: 900; }
  .alert h2 { font-size: 1.2rem; }
  .alert p { margin: 0; font-weight: 700; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="app">
  <div class="top"><b id="topL">Битва коммерсантов</b><span id="roomName" class="room-name">Учебный класс 1</span><span class="pill"><span class="dot" id="netdot"></span><span id="nettxt">подключаемся…</span></span></div>
  <main class="main" id="main"></main>
  <div class="bottom" id="bottom" hidden><span id="meAv"></span><span class="nm" id="meName"></span><span class="sc" id="meScore">0</span></div>
</div>
<div class="alert" id="alert" hidden><div class="box sticker pop" id="alertBox"></div></div>
<div class="toast-stack" id="toasts"></div>

<script src="vendor/qrcode.js"></script>
<script src="questions.js?v=6"></script>
<script src="common.js?v=10"></script>
<script src="student.js?v=10"></script>
</body>
</html>
