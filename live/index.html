<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Битва коммерсантов</title>
<meta name="theme-color" content="#2A5BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Rubik:wght@500;700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=1">
<style>
  body { min-height: 100dvh; }
  .wrap {
    position: relative; z-index: 1; max-width: 560px; margin: 0 auto;
    padding-top: max(14px, env(safe-area-inset-top, 0px)); padding-bottom: 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 18px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .brand { font-family: var(--f-display); font-weight: 900; font-size: 1rem; color: var(--blue); letter-spacing: .02em; }

  /* вход */
  .hero { text-align: center; display: grid; justify-items: center; gap: 8px; padding-top: 6px; }
  .hero .mascot { width: 150px; }
  .hero h1 { font-size: clamp(2rem, 9vw, 2.8rem); font-weight: 900; line-height: .95; color: var(--ink); }
  .hero h1 span { color: var(--blue); display: block; }
  .hero p { margin: 0; color: var(--muted); font-weight: 700; }
  .card { padding: 20px; display: grid; gap: 14px; }
  .blockchip { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--sky); border-radius: 14px; border: 2.5px solid var(--ink); }
  .blockchip .em { font-size: 1.9rem; }
  .blockchip b { font-family: var(--f-display); display: block; font-size: 1.05rem; }
  .blockchip small { font-weight: 800; color: var(--blue-d); }

  /* игровая шапка */
  .me { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .me .who { min-width: 0; flex: 1; }
  .me .who b { display: block; font-family: var(--f-display); font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me .who small { color: var(--muted); font-weight: 800; }
  .score { font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; background: var(--sun); border: var(--line) solid var(--ink); border-radius: 14px; padding: 2px 12px; box-shadow: var(--shadow-s); font-variant-numeric: tabular-nums; }
  .score.bump { animation: popin .5s cubic-bezier(.2, 1.6, .4, 1); }

  .blockhead { display: grid; gap: 4px; }
  .blockhead h2 { font-size: 1.5rem; font-weight: 900; }
  .dots { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .dots i { width: 22px; height: 10px; border-radius: 6px; border: 2px solid var(--ink); background: var(--white); }
  .dots i.cur { background: var(--sun); }
  .dots i.ok { background: var(--mint); }
  .dots i.no { background: var(--tomato); }
  .dots i.wait { background: var(--sky); }

  .qcard { padding: 20px; display: grid; gap: 14px; position: relative; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .qpts { font-family: var(--f-display); font-weight: 900; background: var(--blue); color: var(--white); border-radius: 999px; padding: 2px 10px; border: 2px solid var(--ink); }
  .qtext { font-size: 1.2rem; font-weight: 800; line-height: 1.35; }
  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
    padding: 12px 14px; border: var(--line) solid var(--ink); border-radius: 14px; background: var(--white);
    box-shadow: var(--shadow-s); font-weight: 800; font-size: 1.02rem; line-height: 1.3;
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .opt:active { transform: translate(3px, 3px); box-shadow: none; }
  .opt .L { flex: none; width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; border: 2.5px solid var(--ink); background: var(--paper); }
  .opt:nth-child(1) .L { background: #FFE08A; } .opt:nth-child(2) .L { background: #BFD3FF; }
  .opt:nth-child(3) .L { background: #B6F0D8; } .opt:nth-child(4) .L { background: #FFC7BF; }
  .opts.locked .opt { pointer-events: none; }
  .opt.picked { background: var(--sky); }
  .opt.right { background: var(--mint); color: var(--ink); }
  .opt.wrong { background: var(--tomato); color: var(--white); }
  .opts.locked .opt:not(.right):not(.wrong):not(.picked) { opacity: .55; }
  .verdict { padding: 14px; border-radius: 14px; border: 2.5px solid var(--ink); font-weight: 700; line-height: 1.4; }
  .verdict b { font-family: var(--f-display); font-size: 1.2rem; display: block; margin-bottom: 2px; }
  .verdict.ok { background: #D7F7EA; } .verdict.no { background: #FFE1DC; } .verdict.wait { background: var(--paper); }
  .float {
    position: absolute; right: 18px; top: -10px; font-family: var(--f-display); font-weight: 900; font-size: 2.2rem;
    color: var(--mint); -webkit-text-stroke: 2px var(--ink); animation: floatup 1.4s ease-out forwards; pointer-events: none;
  }
  @keyframes floatup { from { transform: translateY(20px) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(0) scale(1.15); } to { transform: translateY(-50px); opacity: 0; } }
  .spinner { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--ink); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .center { text-align: center; display: grid; gap: 12px; justify-items: center; padding: 26px 20px; }
  .center .mascot { width: 130px; }
  .center h2 { font-size: 1.7rem; font-weight: 900; }
  .bigstat { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bigstat div { padding: 10px 16px; border: 2.5px solid var(--ink); border-radius: 14px; background: var(--paper); min-width: 100px; }
  .bigstat b { display: block; font-family: var(--f-display); font-size: 1.8rem; font-weight: 900; }
  .bigstat small { font-weight: 800; color: var(--muted); }
  .muted { color: var(--muted); font-weight: 700; margin: 0; }
  .linkbtn { background: none; border: 0; text-decoration: underline; font-weight: 800; color: var(--muted); padding: 6px; }

  /* оповещение о штрафе/бонусе */
  .alert { position: fixed; inset: 0; z-index: 600; display: grid; place-items: center; background: rgba(23, 32, 54, .55); padding: 20px; }
  .alert .box { width: min(100%, 380px); padding: 24px; text-align: center; display: grid; gap: 8px; justify-items: center; }
  .alert .em { font-size: 4rem; line-height: 1; }
  .alert .delta { font-family: var(--f-display); font-weight: 900; font-size: 3.4rem; -webkit-text-stroke: 2px var(--ink); }
  .alert.neg .box { background: #FFE1DC; } .alert.neg .delta { color: var(--tomato); }
  .alert.pos .box { background: #D7F7EA; } .alert.pos .delta { color: var(--mint); }
  .alert h3 { font-size: 1.4rem; }
  .alert .mascot { width: 90px; }
</style>
</head>
<body>
<div class="shavings" aria-hidden="true"></div>
<div class="wrap">
  <div class="topbar">
    <span class="brand">ОПП · Модуль 3</span>
    <span class="pill" id="net"><span class="dot" id="netdot"></span><span id="nettxt">подключаемся…</span></span>
  </div>

  <!-- Вход -->
  <section id="v-join" hidden>
    <div class="hero">
      <div class="bob" id="joinMascot"></div>
      <h1>Битва <span>коммерсантов</span></h1>
      <p>Отвечай на вопросы — зарабатывай очки</p>
    </div>
    <form class="card sticker" id="joinForm" autocomplete="on" style="margin-top:16px">
      <div class="blockchip" id="joinBlock" hidden></div>
      <div class="field"><label for="fam">Фамилия</label><input id="fam" name="family-name" autocomplete="family-name" required maxlength="30" placeholder="Например, Иванов"></div>
      <div class="field"><label for="nam">Имя</label><input id="nam" name="given-name" autocomplete="given-name" required maxlength="30" placeholder="Например, Пётр"></div>
      <button class="btn btn--blue" type="submit" id="joinBtn">Поехали! 🚀</button>
      <p class="muted" style="font-size:.85rem;text-align:center">Пиши настоящие фамилию и имя — по ним преподаватель видит рейтинг</p>
    </form>
  </section>

  <!-- Игра -->
  <section id="v-game" hidden style="display:grid;gap:16px">
    <div class="me sticker">
      <div class="avatar" id="meAv"></div>
      <div class="who"><b id="meName"></b><small id="meRank">в игре</small></div>
      <div class="score" id="meScore">0</div>
    </div>
    <div id="stage"></div>
    <div style="text-align:center"><button class="linkbtn" id="logout" type="button">Это не я — сменить имя</button></div>
  </section>
</div>

<div class="alert" id="alert" hidden>
  <div class="box sticker pop-in" id="alertBox"></div>
</div>
<div class="toast-stack" id="toasts"></div>

<script src="vendor/qrcode.js"></script>
<script src="questions.js?v=1"></script>
<script src="common.js?v=1"></script>
<script src="student.js?v=1"></script>
</body>
</html>
