<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Битва коммерсантов · ведущий</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Unbounded:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css?v=6">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  .scr { position: relative; z-index: 1; height: 100%; }

  /* ---------- вход ---------- */
  #v-login { display: grid; place-items: center; gap: 26px; align-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
  #v-login .logo { font-size: clamp(2.2rem, 7vw, 4rem); text-align: center; }
  .lcard { width: min(100%, 400px); padding: 24px; display: grid; gap: 14px; text-align: center; }
  .lcard .err { color: var(--navy); font-weight: 800; min-height: 1.3em; margin: 0; }

  /* ---------- ведущий ---------- */
  #v-host { display: grid; grid-template-rows: auto 1fr; font-size: clamp(13px, 1.05vw, 24px); }
  .bar { display: flex; align-items: center; gap: .6em; padding: .8em max(16px, 1.4em) .2em; flex-wrap: wrap; }
  .bar .logo { font-size: 1.25em; text-shadow: 1px 1px 0 var(--navy), 2px 2px 0 var(--navy), 3px 3px 0 var(--navy); }
  .bar .sp { flex: 1; }
  .room-select { padding: .55em .7em; border: 3px solid var(--navy); border-radius: 10px; background: var(--white); color: var(--navy); font: inherit; font-weight: 800; font-size: .82em; max-width: 100%; cursor: pointer; }
  .pult .room-select { width:100%; min-height:44px; font-size:1rem; }
  .bar .pill { font-size: .8em; }
  .ib { display: inline-flex; align-items: center; gap: .4em; padding: .55em .9em; border-radius: 10px; background: var(--white); color: var(--navy); border: 3px solid var(--navy); box-shadow: 3px 3px 0 var(--navy); font-weight: 800; font-size: .8em; }
  .ib:hover { transform: translate(-1px, -1px); }
  .ib.warn { background: var(--navy); color: var(--white); border-color: var(--white); }
  .menu { position: absolute; right: max(16px, 1.4em); top: 3.8em; z-index: 60; background: var(--white); color: var(--navy); border: 4px solid var(--navy); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 16em; }
  .menu button { text-align: left; padding: .7em .9em; border-radius: 8px; font-weight: 800; color: var(--navy); }
  .menu button:hover { background: var(--ice); }

  .stage { position: relative; min-height: 0; padding: .4em max(16px, 1.6em) 1.2em; display: flex; flex-direction: column; }
  .nextbtn { position: fixed; right: max(16px, 1.6em); bottom: max(16px, 1.2em); z-index: 50; font-size: 1em; padding: .9em 1.4em; transform: rotate(-1.5deg); }
  .nextbtn:hover { transform: rotate(-1.5deg) translate(-2px, -2px); }
  .nextbtn kbd { font: inherit; font-size: .62em; opacity: .7; border: 2px solid currentColor; border-radius: 5px; padding: .05em .35em; margin-left: .5em; text-transform: lowercase; }

  /* ведущий-комментатор */
  .host { position: fixed; left: max(16px, 1.6em); bottom: max(16px, 1.2em); z-index: 40; display: flex; align-items: flex-end; gap: .6em; max-width: min(46%, 34em); pointer-events: none; }
  .host .mic { flex: none; width: 3.4em; height: 3.4em; border-radius: 50%; background: var(--navy); border: 4px solid var(--white); display: grid; place-items: center; font-size: 1.3em; }
  .host .say { position: relative; background: var(--white); color: var(--navy); border: 4px solid var(--navy); border-radius: 18px 18px 18px 4px; box-shadow: var(--shadow-s); padding: .7em 1em; font-weight: 800; font-size: 1em; line-height: 1.3; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }

  /* лобби */
  .lobby { flex: 1; display: grid; grid-template-columns: minmax(0, .95fr) minmax(0, 1.35fr); gap: 2em; min-height: 0; padding-bottom: 5.5em; }
  .joincol { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1em; min-height: 0; }
  .joincol .logo { font-size: 3.3em; text-align: center; }
  .joincard { padding: 1.2em 1.4em; display: flex; flex-direction: column; align-items: center; gap: .6em; text-align: center; }
  .joincard .qr { width: min(17em, 34vh); aspect-ratio: 1; }
  .joincard .qr svg { width: 100%; height: 100%; display: block; }
  .joincard .url { font-family: var(--f-d); font-weight: 800; font-size: .85em; overflow-wrap: anywhere; }
  .rightcol { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5em, 1fr)); gap: .55em; }
  .slot { display: flex; align-items: center; gap: .5em; padding: .45em .6em; border-radius: 12px; border: 3px dashed rgba(255, 255, 255, .55); min-height: 3em; font-weight: 800; font-size: .9em; color: var(--dim); }
  .slot.on { border: 3px solid var(--navy); background: var(--white); color: var(--navy); box-shadow: 3px 3px 0 var(--navy); animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .slot .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .av { --s: 2em; font-size: .75em; }
  .more { font-family: var(--f-d); font-weight: 800; text-transform: uppercase; font-size: .8em; }
  .phead { display: flex; align-items: center; gap: .8em; flex-wrap: wrap; }
  .phead h2 { font-size: 1.3em; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5em, 1fr)); gap: .6em; overflow: auto; padding: 4px 8px 8px 4px; min-height: 0; }
  .pt { display: grid; grid-template-columns: auto 1fr; gap: .1em .6em; align-items: center; text-align: left; padding: .65em .75em; border-radius: 14px; background: var(--white); color: var(--navy); border: 3px solid var(--navy); box-shadow: 3px 3px 0 var(--navy); transition: transform .15s; }
  .pt:nth-child(3n+1) { transform: rotate(-.8deg); } .pt:nth-child(3n+2) { transform: rotate(.6deg); }
  .pt:hover { transform: translate(-2px, -2px) rotate(-1deg); }
  .pt .e { grid-row: span 2; font-size: 1.6em; }
  .pt b { font-size: .85em; line-height: 1.15; }
  .pt small { font-weight: 700; font-size: .72em; opacity: .7; }
  .pt.done { opacity: .5; }
  .pt.next { background: var(--navy); color: var(--white); border-color: var(--white); box-shadow: 0 0 0 3px var(--navy), 5px 5px 0 3px var(--navy); }

  /* заставка */
  .intro { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: .9em; padding-bottom: 5em; position: relative; }
  .intro .e { font-size: 6em; line-height: 1; position: relative; z-index: 1; }
  .intro h1 { font-size: 3.6em; max-width: 16ch; position: relative; z-index: 1; color: var(--white); text-shadow: 1px 1px 0 var(--navy), 2px 2px 0 var(--navy), 3px 3px 0 var(--navy), 4px 4px 0 var(--navy), 5px 5px 0 var(--navy), 6px 6px 0 var(--navy); }
  .intro .ribbon { position: relative; z-index: 1; }
  .intro .facts { position: relative; z-index: 1; padding: .7em 1.2em; font-weight: 800; font-size: 1.1em; }
  .cornerqr { position: absolute; right: max(16px, 1.6em); top: .4em; display: flex; gap: .7em; align-items: center; padding: .5em .7em; }
  .cornerqr .qr { width: 6.5em; height: 6.5em; } .cornerqr .qr svg { width: 100%; height: 100%; display: block; }
  .cornerqr b { display: block; font-family: var(--f-d); font-size: .8em; text-transform: uppercase; } .cornerqr span { font-weight: 700; font-size: .8em; }

  /* вопрос */
  .qtop { display: flex; align-items: flex-start; gap: 1.2em; }
  .qbar { flex: 1; padding: .8em 1.2em; font-weight: 800; font-size: 2em; line-height: 1.22; text-wrap: balance; }
  .timer { flex: none; width: 5.2em; height: 5.2em; border-radius: 50%; background: var(--white); color: var(--navy); border: 5px solid var(--navy); box-shadow: var(--shadow-s); display: grid; place-items: center; font-family: var(--f-d); font-weight: 900; font-size: 1.5em; transform: rotate(4deg); }
  .timer.hurry { background: var(--navy); color: var(--white); border-color: var(--white); animation: pulse .5s ease-in-out infinite; }
  .qmeta { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin: 1em 0 .9em; }
  .qmeta .cnt { font-family: var(--f-d); font-weight: 900; font-size: 1.4em; text-transform: uppercase; }
  .qmeta .cnt b { font-size: 1.6em; }
  .hopts { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); gap: 1.1em 1.3em; align-content: stretch; padding-bottom: 6em; min-height: 0; max-height: 30em; }
  .hopts.two { grid-template-columns: 1fr 1fr; }
  .hopts .opt { padding: .8em 1em; font-size: 1.7em; min-height: 2.6em; flex-wrap: wrap; align-content: center; }
  .hopts .opt:nth-child(odd) { transform: rotate(-.7deg); } .hopts .opt:nth-child(even) { transform: rotate(.7deg); }
  .hopts .opt.right { transform: scale(1.03) rotate(-1deg); }
  .voters { display: flex; flex-wrap: wrap; gap: .3em; width: 100%; padding-left: 2.6em; margin-top: .3em; }
  .voters .av { --s: 2.4em; font-size: .55em; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) both; }
  .voters .nmore { font-size: .55em; font-weight: 800; align-self: center; }
  .hcount { margin-left: auto; font-family: var(--f-d); font-weight: 900; font-size: .9em; }
  .explain { padding: .8em 1.1em; font-weight: 700; font-size: 1.15em; line-height: 1.35; margin-top: 1.3em; max-width: 60em; align-self: flex-start; }

  /* рейтинг */
  .board { flex: 1; display: grid; align-content: start; justify-items: center; gap: 1em; padding: .4em 0 6em; }
  .brows { display: grid; gap: .7em; width: min(100%, 52em); }
  .brow { display: flex; align-items: center; gap: .8em; padding: .6em 1em; border-radius: 16px; background: var(--white); color: var(--navy); border: 4px solid var(--navy); box-shadow: var(--shadow-s); font-size: 1.3em; font-weight: 800; }
  .brow:nth-child(odd) { transform: rotate(-.6deg); } .brow:nth-child(even) { transform: rotate(.5deg); }
  .brow .r { font-family: var(--f-d); font-weight: 900; width: 1.6em; text-align: center; }
  .brow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brow .gain { font-family: var(--f-d); font-size: .7em; background: var(--blue); color: var(--white); padding: .2em .5em; border-radius: 8px; }
  .brow .st { font-size: .8em; }
  .brow .s { font-family: var(--f-d); font-weight: 900; min-width: 4.4em; text-align: right; font-variant-numeric: tabular-nums; }
  .brow.lead { background: var(--navy); color: var(--white); border-color: var(--white); box-shadow: 0 0 0 4px var(--navy), 7px 7px 0 4px rgba(7, 26, 92, .5); }
  .brow.lead .gain { background: var(--white); color: var(--navy); }
  .bmore { font-weight: 800; }

  /* подиум */
  .podium { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 15em)); justify-content: center; align-items: end; gap: 1.4em; padding-bottom: 5.5em; position: relative; }
  .pcol { display: grid; justify-items: center; gap: .5em; text-align: center; position: relative; z-index: 1; }
  .pcol .av { --s: 3.4em; font-size: 1.15em; }
  .pcol .who { font-family: var(--f-d); font-weight: 800; font-size: 1.15em; line-height: 1.1; text-transform: uppercase; animation: rise .6s both; }
  .pcol .pts { font-weight: 800; animation: rise .6s both; }
  .pcol .blk { width: 100%; border-radius: 14px 14px 0 0; display: grid; place-items: start center; padding-top: .2em; font-family: var(--f-d); font-size: 4em; font-weight: 900; border: 5px solid var(--navy); border-bottom: 0; transform-origin: bottom; animation: grow .9s cubic-bezier(.2, 1.1, .4, 1) both; }
  @keyframes grow { from { transform: scaleY(0); } }
  .pcol.p1 .blk { height: 3.6em; background: var(--white); color: var(--navy); }
  .pcol.p2 .blk { height: 2.7em; background: var(--navy); color: var(--white); }
  .pcol.p3 .blk { height: 2em; background: var(--sky); color: var(--white); }

  /* оверлеи */
  .ov { position: fixed; inset: 0; z-index: 70; background: rgba(7, 26, 92, .9); display: flex; flex-direction: column; padding: 1.4em max(16px, 2em); font-size: clamp(13px, 1vw, 22px); }
  .ovhead { display: flex; align-items: center; gap: 1em; margin-bottom: 1em; flex-wrap: wrap; }
  .ovhead h2 { font-size: 1.8em; flex: 1; }
  .ovhead input { background: var(--white); padding: .75em 1em; border-radius: 12px; border: 4px solid var(--white); font-weight: 800; font-size: 1em; min-width: 14em; color: var(--navy); }
  .ovbody { flex: 1; overflow: auto; min-height: 0; padding: 4px; }
  .plgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(19em, 1fr)); gap: .7em; padding-bottom: 1em; }
  .plb { display: flex; align-items: center; gap: .7em; padding: .6em .8em; border-radius: 12px; background: var(--white); color: var(--navy); border: 3px solid var(--navy); box-shadow: 3px 3px 0 rgba(0, 0, 0, .3); font-weight: 800; text-align: left; }
  .plb:hover { background: var(--ice); }
  .plb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plb .r { font-family: var(--f-d); width: 1.8em; text-align: center; }
  .plb .s { font-family: var(--f-d); font-variant-numeric: tabular-nums; }
  .empty { font-weight: 800; text-align: center; padding: 3em 1em; }

  .modal { position: fixed; inset: 0; z-index: 90; background: rgba(7, 26, 92, .75); display: grid; place-items: center; padding: 16px; }
  .modal .box { width: min(100%, 560px); max-height: calc(100% - 16px); overflow: auto; padding: 20px; display: grid; gap: 14px; font-size: 16px; }
  .mhead { display: flex; align-items: center; gap: 12px; }
  .mhead .av { --s: 2.8em; }
  .mhead b { font-family: var(--f-d); font-size: 1.1rem; display: block; line-height: 1.15; text-transform: uppercase; }
  .mhead small { font-weight: 800; }
  .mhead .x { margin-left: auto; width: 2.4em; height: 2.4em; border-radius: 50%; border: 3px solid var(--navy); font-weight: 900; color: var(--navy); }
  .lbl { font-family: var(--f-d); font-weight: 800; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .vb { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--navy); color: var(--white); border: 3px solid var(--navy); font-weight: 800; box-shadow: 3px 3px 0 var(--sky); }
  .vb.pos { background: var(--white); color: var(--navy); box-shadow: 3px 3px 0 var(--navy); }
  .vb .e { font-size: 1.6rem; line-height: 1; }
  .vb .d { font-family: var(--f-d); font-weight: 900; }
  .vb:active { transform: translate(3px, 3px); box-shadow: none; }
  .custom { display: grid; grid-template-columns: 6em 1fr; gap: 8px; }
  .custom input { padding: .65em .8em; border: 3px solid var(--navy); border-radius: 10px; font-weight: 800; width: 100%; min-width: 0; color: var(--navy); background: var(--ice); }
  .mrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
  .hist { display: grid; gap: 6px; font-weight: 700; font-size: .9rem; }
  .hist div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 8px; background: var(--ice); }

  .epop { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; background: rgba(7, 26, 92, .72); pointer-events: none; animation: fi .25s both; }
  .epop.out { animation: fo .4s both; }
  @keyframes fi { from { opacity: 0; } } @keyframes fo { to { opacity: 0; } }
  .epop .box { min-width: min(92vw, 32em); max-width: 92vw; padding: 1.6em 2.4em; text-align: center; display: grid; gap: .35em; justify-items: center; font-size: clamp(14px, 1.3vw, 26px); transform: rotate(-2deg); animation: slam .55s cubic-bezier(.2, 1.4, .4, 1) both; }
  .epop .em { font-size: 4em; line-height: 1; }
  .epop .nm { font-family: var(--f-d); font-size: 1.9em; font-weight: 900; text-transform: uppercase; }
  .epop .rs { font-weight: 800; font-size: 1.15em; max-width: 26em; }
  .epop .dl { font-family: var(--f-d); font-size: 4em; font-weight: 900; line-height: 1; }
  .epop.neg .box { background: var(--navy); color: var(--white); border-color: var(--white); }

  .banner { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 99; background: var(--navy); color: var(--white); border: 3px solid var(--white); padding: .6em 1.2em; font-weight: 800; border-radius: 12px; }

  /* ---------- пульт ---------- */
  #v-pult { overflow: auto; }
  .pult { max-width: 620px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
  .pult .row1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .pult h1 { font-size: 1.1rem; }
  .pnow { padding: 16px; display: grid; gap: 8px; }
  .pnow .ph { font-family: var(--f-d); font-weight: 800; font-size: .7rem; letter-spacing: .05em; text-transform: uppercase; }
  .pnow .qt { font-weight: 800; line-height: 1.3; }
  .pnow .ans { font-weight: 800; background: var(--ice); border-radius: 8px; padding: 6px 10px; }
  .pnow .big { width: 100%; font-size: 1rem; padding: 1em; }
  .pblocks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pblocks .pt { font-size: 14px; transform: none; }
  .pult input[type=search] { background: var(--white); width: 100%; padding: .8em 1em; border: 4px solid var(--navy); border-radius: 12px; font-weight: 800; font-size: 1rem; color: var(--navy); }
  .pult .plgrid { grid-template-columns: 1fr; }
  .pult .plb { font-size: 16px; }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .lobby { grid-template-columns: 1fr; }
    .hopts { grid-template-columns: 1fr; }
    .host { display: none; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<section class="scr" id="v-login"><div class="logo slam">Битва<span>коммерсантов</span></div><div class="lcard sticker"><p id="loadingStatus">Загрузка экрана ведущего…</p></div></section>

<section class="scr" id="v-host" hidden>
  <div class="bar">
    <div class="logo">Битва коммерсантов</div>
    <select class="room-select" id="hostRoom" aria-label="Выберите учебный класс">
      <option value="class1">Учебный класс 1</option>
      <option value="class2">Учебный класс 2</option>
    </select>
    <div class="sp"></div>
    <select class="room-select" id="hostNetwork" aria-label="Сервер связи" title="Один сервер связи для всех устройств класса">
      <option value="emqx">Сервер EMQX</option>
      <option value="hivemq">Сервер HiveMQ</option>
      <option value="mosquitto">Сервер Mosquitto</option>
    </select>
    <span class="pill"><span class="dot" id="hNetDot"></span><span id="hNet">связь…</span></span>
    <span class="pill">👥 <span id="hCount">0</span></span>
    <button class="ib" type="button" id="bRating">🏆 Рейтинг</button>
    <button class="ib warn" type="button" id="bPen">⚠️ Штраф / бонус</button>
    <button class="ib" type="button" id="bPult">📱 Пульт</button>
    <button class="ib" type="button" id="bSound" aria-label="Звук">🔊</button>
    <button class="ib" type="button" id="bMenu" aria-label="Меню">⋯</button>
  </div>
  <div class="menu" id="menu" hidden>
    <button type="button" id="mLobby">🏠 К выбору практики</button>
    <button type="button" id="mCsv">⬇ Скачать таблицу результатов</button>
    <button type="button" id="mReset">♻ Новый урок (обнулить очки)</button>
    <button type="button" id="mOut">🚪 Выйти</button>
  </div>
  <main class="stage" id="stage"></main>
  <div class="host" id="hostSay" aria-live="polite"></div>
  <button class="btn nextbtn" type="button" id="next" hidden></button>
</section>

<section class="scr" id="v-pult" hidden>
  <div class="pult">
    <div class="row1"><h1 class="logo">📱 Пульт</h1><span class="pill"><span class="dot" id="pNetDot"></span><span id="pNet">связь…</span></span></div>
    <select class="room-select" id="pultRoom" aria-label="Выберите учебный класс для пульта">
      <option value="class1">Учебный класс 1</option>
      <option value="class2">Учебный класс 2</option>
    </select>
    <div class="pnow sticker" id="pNow"></div>
    <div id="pBlocks"></div>
